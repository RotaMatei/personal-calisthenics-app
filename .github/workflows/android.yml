name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (pure Kotlin)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # Compile errors are not visible through the API, so surface them as annotations.
      - name: Report build errors
        if: failure()
        run: |
          {
            grep -E '^e: |error:|FAILED|What went wrong' -A3 build.log | head -80 || true
          } > errors.txt
          MSG=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt | head -c 6000)
          echo "::error title=Build errors::${MSG}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            core/build/test-results

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: calisthenics-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
